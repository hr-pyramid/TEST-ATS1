<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TalentPool ATS — Sign In</title>
<style>
  :root{ --bg:#0f1729; --card:#ffffff; --ink:#1a202c; --muted:#64748b; --line:#e2e8f0;
         --brand:#4338ca; --brand-2:#6d28d9; --err:#dc2626; }
  *{ box-sizing:border-box; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; margin:0; height:100vh;
        display:flex; align-items:center; justify-content:center;
        background:radial-gradient(900px 600px at 15% 10%, #1e293b 0%, var(--bg) 55%); }
  .card{ background:var(--card); padding:38px 34px; border-radius:14px; width:100%; max-width:380px;
         box-shadow:0 24px 60px rgba(0,0,0,.35); }
  .brand{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .dot{ width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,var(--brand),var(--brand-2)); }
  .brand b{ font-size:1.25em; color:var(--ink); letter-spacing:-.3px; }
  .sub{ color:var(--muted); font-size:.85em; margin:0 0 22px 0; }
  label{ font-weight:600; font-size:.8em; color:#475569; display:block; margin:14px 0 6px; }
  input{ width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:8px; font-size:1em; }
  input:focus{ outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(67,56,202,.15); }
  button{ width:100%; padding:12px; margin-top:22px; border:none; border-radius:8px; cursor:pointer;
          font-weight:700; color:#fff; background:linear-gradient(135deg,var(--brand),var(--brand-2)); }
  button:hover{ filter:brightness(1.07); }
  #message{ margin-top:14px; font-size:.88em; font-weight:600; min-height:18px; color:var(--err); }
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><span class="dot"></span><b>TalentPool ATS</b></div>
    <p class="sub">Recruitment workspace access</p>
    <label>Username</label>
    <input type="text" id="username" autocomplete="username">
    <label>Password</label>
    <input type="password" id="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')attemptLogin()">
    <button onclick="attemptLogin()">Sign In</button>
    <div id="message"></div>
  </div>
<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxx3xc-xS4AxlFjiivkDZga5BgReYjSHJX6gHzGkYbiPicoNt1A7mzqr8QAY5OHoONdLA/exec";

  function attemptLogin(){
    const u = document.getElementById('username').value;
    const p = document.getElementById('password').value;
    const msg = document.getElementById('message');
    if(!u || !p){ msg.style.color="#dc2626"; msg.innerText="Please complete all fields."; return; }
    msg.style.color="#4338ca"; msg.innerText="Authenticating…";
    fetch(`${API_URL}?action=login&username=${encodeURIComponent(u)}&password=${encodeURIComponent(p)}`, { method:"GET", redirect:"follow" })
      .then(r=>r.json())
      .then(res=>{
        if(res.status==="success"){
          localStorage.setItem("portalSession","authenticated");
          localStorage.setItem("portalUser", res.user || u);
          localStorage.setItem("portalRole", res.role || "Recruiter");
          window.location.href="index.html";
        } else { msg.style.color="#dc2626"; msg.innerText=res.message; }
      })
      .catch(()=>{ msg.style.color="#dc2626"; msg.innerText="Connection lost. Check API deployment."; });
  }
</script>
</body>
</html>
